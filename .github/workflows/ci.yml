name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Buf
        # Runs build, lint, format, and breaking on pull requests.
        # Breaking changes compare against the PR base; skip them on a PR
        # with the "buf skip breaking" label when a break is intentional.
        uses: bufbuild/buf-action@v1
        with:
          version: "1.54.0"
          lint: ${{ contains(fromJSON('["push", "pull_request"]'), github.event_name) }}
          push: false
          pr_comment: false

  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.54.0"
      - name: Regenerate Go code
        run: buf generate
      - name: Verify generated code is committed and up to date
        # Fails when buf generate changed tracked files or produced
        # untracked ones, i.e. when the Go code is stale.
        run: test -z "$(git status --porcelain)"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and vet generated code
        run: go build ./... && go vet ./...
